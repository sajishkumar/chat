<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
:root {
    --bg:#0c1317;--panel:#111b21;--hdr:#202c33;--chat:#0b141a;
    --input:#2a3942;--sent-bg:#005c4b;--recv-bg:#1f2c34;
    --txt:#e9edef;--txt2:#8696a0;--txt3:#667781;
    --grn:#00a884;--grn2:#06cf9c;--bdr:#222d34;--red:#ef4444;--blue:#53bdeb;
    --fn:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

/* ═══ FIX: Full height on mobile with keyboard ═══ */
html{height:100%;overflow:hidden;}
body{
    height:100%;overflow:hidden;
    font-family:var(--fn);background:var(--bg);color:var(--txt);
    -webkit-font-smoothing:antialiased;
}

.screen{
    position:fixed;top:0;left:0;right:0;bottom:0;
    display:flex;flex-direction:column;
    transition:opacity .3s,transform .3s;
}
.screen.hidden{opacity:0;pointer-events:none;transform:translateY(16px);}

/* ═══ SETUP SCREEN ═══ */
#setup-screen{
    background:radial-gradient(ellipse at top,#0d2133 0%,#0c1317 65%);
    align-items:center;justify-content:center;padding:20px;gap:24px;
    overflow-y:auto;
}
.brand{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;}
.brand-icon{
    width:80px;height:80px;border-radius:50%;
    background:linear-gradient(135deg,#00a884,#128c7e);
    display:flex;align-items:center;justify-content:center;font-size:40px;
    box-shadow:0 0 0 10px rgba(0,168,132,.1),0 12px 40px rgba(0,168,132,.3);
}
.brand h1{font-size:26px;font-weight:700;}
.brand p{font-size:14px;color:var(--txt2);line-height:1.5;max-width:280px;}
.setup-card{
    width:100%;max-width:400px;background:var(--panel);border:1px solid var(--bdr);
    border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;gap:16px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.8px;}
.field input{
    padding:14px 16px;background:var(--input);border:1.5px solid transparent;
    border-radius:12px;color:var(--txt);font-size:16px;font-family:var(--fn);
    outline:none;transition:border-color .2s;
}
.field input:focus{border-color:var(--grn);}
.field input::placeholder{color:var(--txt3);}
.btn{
    padding:16px;border:none;border-radius:12px;font-size:16px;font-weight:700;
    font-family:var(--fn);cursor:pointer;transition:all .18s;
    display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary{
    background:linear-gradient(135deg,#00a884,#128c7e);color:#fff;
    box-shadow:0 6px 20px rgba(0,168,132,.35);
}
.btn-primary:active{transform:scale(.97);}
.room-hint{
    background:rgba(0,168,132,.08);border:1px solid rgba(0,168,132,.2);
    border-radius:10px;padding:10px 12px;font-size:13px;color:var(--txt2);
    line-height:1.5;display:flex;align-items:flex-start;gap:8px;
}

/* ═══ CHAT SCREEN — fixed layout ═══ */
#chat-screen{
    display:flex;flex-direction:column;
}

/* Header */
.chat-hdr{
    background:var(--hdr);padding:10px 12px;
    display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--bdr);flex-shrink:0;z-index:10;
}
.hdr-avatar{
    width:40px;height:40px;border-radius:50%;
    background:linear-gradient(135deg,#00a884,#128c7e);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:700;flex-shrink:0;
}
.hdr-info{flex:1;min-width:0;}
.hdr-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:12px;color:var(--txt2);display:flex;align-items:center;gap:5px;}
.status-dot{width:7px;height:7px;border-radius:50%;background:#f59e0b;flex-shrink:0;}
.status-dot.online{background:var(--grn);}
.status-dot.offline{background:var(--txt3);}
.icon-btn{
    background:none;border:none;color:var(--txt2);font-size:20px;cursor:pointer;
    padding:8px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}

/* ═══ FIX: Messages area takes remaining space and SCROLLS ═══ */
.msgs-wrap{
    flex:1 1 0;
    min-height:0; /* CRITICAL for flex scroll */
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    background:var(--chat);
    display:flex;flex-direction:column;
    padding:10px 12px 6px;gap:3px;
    overscroll-behavior:contain;
}
.msgs-wrap::-webkit-scrollbar{width:3px;}
.msgs-wrap::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px;}

/* Date sep */
.date-sep{
    align-self:center;background:rgba(11,20,26,.85);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.06);border-radius:8px;
    padding:4px 12px;font-size:12px;color:var(--txt2);margin:8px 0 4px;
}
.sys-msg{
    align-self:center;background:rgba(0,168,132,.1);border:1px solid rgba(0,168,132,.2);
    border-radius:8px;padding:5px 14px;font-size:13px;color:var(--grn2);
    margin:4px 0;text-align:center;max-width:88%;animation:fadeUp .3s ease;
}

/* Message rows */
.msg-row{display:flex;flex-direction:column;max-width:80%;animation:fadeUp .2s ease;position:relative;}
.msg-row.sent{align-self:flex-end;align-items:flex-end;}
.msg-row.recv{align-self:flex-start;align-items:flex-start;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ═══ FIX: Bigger text ═══ */
.bubble{
    padding:9px 14px;word-break:break-word;line-height:1.5;
    font-size:16px; /* BIGGER */
    position:relative;max-width:100%;
}
.sent .bubble{background:var(--sent-bg);border-radius:16px 4px 16px 16px;color:#fff;}
.recv .bubble{background:var(--recv-bg);border-radius:4px 16px 16px 16px;color:var(--txt);}
.sender-name{font-size:13px;font-weight:700;color:var(--grn);margin-bottom:2px;padding-left:4px;}
.bubble-meta{
    font-size:11px;color:var(--txt2);margin-top:3px;padding:0 3px;
    display:flex;align-items:center;gap:4px;
}
.sent .bubble-meta{justify-content:flex-end;}
.tick{font-size:14px;color:var(--txt3);transition:color .3s;}
.tick.read{color:var(--blue);}

/* Selected message */
.msg-row.selected .bubble{outline:2px solid var(--grn);outline-offset:2px;}

/* Deleted message */
.msg-row.deleted .bubble{
    background:transparent !important;border:1px dashed var(--txt3);
    font-style:italic;color:var(--txt3);padding:8px 14px;
}

/* ═══ DELETE BAR (appears when message selected) ═══ */
#delete-bar{
    display:none;flex-shrink:0;
    background:var(--hdr);border-top:1px solid var(--bdr);
    padding:10px 14px;gap:10px;
    align-items:center;justify-content:space-between;
    animation:slideUp .2s ease;
}
#delete-bar.show{display:flex;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:none;}}
.del-bar-btn{
    padding:10px 18px;border:none;border-radius:10px;font-size:14px;font-weight:600;
    font-family:var(--fn);cursor:pointer;display:flex;align-items:center;gap:6px;
}
.del-everyone{background:var(--red);color:#fff;}
.del-me{background:var(--input);color:var(--txt);}
.del-cancel{background:none;border:none;color:var(--txt2);font-size:14px;font-family:var(--fn);cursor:pointer;padding:10px;}

/* Typing */
.typing-row{align-self:flex-start;display:none;margin:2px 12px;}
.typing-row.show{display:flex;}
.typing-bubble{
    background:var(--recv-bg);border-radius:4px 16px 16px 16px;
    padding:10px 14px;display:flex;align-items:center;gap:5px;
}
.typing-name{font-size:12px;color:var(--txt2);margin-right:4px;}
.td{width:6px;height:6px;border-radius:50%;background:var(--txt2);animation:typeBounce .9s infinite;}
.td:nth-child(2){animation-delay:.15s;}
.td:nth-child(3){animation-delay:.3s;}
@keyframes typeBounce{0%,80%,100%{transform:scale(.5);opacity:.4;}40%{transform:scale(1);opacity:1;}}

/* ═══ FIX: Input bar stays above keyboard ═══ */
.input-bar{
    display:flex;align-items:flex-end;gap:8px;
    padding:8px 10px;
    background:var(--panel);border-top:1px solid var(--bdr);
    flex-shrink:0;
}
.textarea-wrap{
    flex:1;background:var(--input);border-radius:24px;
    display:flex;align-items:flex-end;padding:10px 14px;min-height:46px;
}
#msg-input{
    flex:1;background:none;border:none;outline:none;color:var(--txt);
    font-size:16px; /* BIGGER */
    font-family:var(--fn);resize:none;line-height:1.4;
    max-height:100px;scrollbar-width:none;
}
#msg-input::placeholder{color:var(--txt3);}
#msg-input::-webkit-scrollbar{display:none;}
.send-btn{
    width:46px;height:46px;border-radius:50%;
    background:linear-gradient(135deg,#00a884,#128c7e);
    border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;transition:transform .15s;
    box-shadow:0 4px 12px rgba(0,168,132,.3);
}
.send-btn:active{transform:scale(.9);}
.send-btn svg{width:22px;height:22px;fill:#fff;margin-left:2px;}

/* ═══ CLEAR ALL MODAL ═══ */
.modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;z-index:200;padding:16px;
}
.modal-bg.show{display:flex;}
.modal-box{
    background:var(--panel);border:1px solid var(--bdr);border-radius:18px;
    padding:22px;width:100%;max-width:340px;
    animation:ctxPop .2s ease;
}
@keyframes ctxPop{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:none;}}
.modal-box h3{font-size:18px;font-weight:700;margin-bottom:8px;}
.modal-box p{font-size:14px;color:var(--txt2);margin-bottom:18px;line-height:1.5;}
.modal-btns{display:flex;gap:10px;}
.modal-btns button{
    flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;
    font-weight:600;font-family:var(--fn);cursor:pointer;
}
.modal-btns .m-cancel{background:var(--input);color:var(--txt);}
.modal-btns .m-danger{background:var(--red);color:#fff;}

/* Scroll btn */
#scroll-btn{
    position:absolute;bottom:72px;right:14px;width:40px;height:40px;border-radius:50%;
    background:var(--hdr);border:1px solid var(--bdr);color:var(--txt2);font-size:18px;
    display:none;align-items:center;justify-content:center;cursor:pointer;z-index:5;
    box-shadow:0 4px 16px rgba(0,0,0,.3);
}
#scroll-btn.show{display:flex;}

/* Toast */
#toast{
    position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(12px);
    background:var(--hdr);border:1px solid var(--bdr);border-radius:12px;
    padding:10px 20px;font-size:14px;color:var(--txt);opacity:0;
    transition:all .3s;z-index:300;white-space:nowrap;pointer-events:none;
    box-shadow:0 8px 28px rgba(0,0,0,.35);max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ═══ Header menu ═══ */
.hdr-menu{
    position:absolute;top:56px;right:8px;z-index:50;
    background:var(--hdr);border:1px solid var(--bdr);border-radius:12px;
    padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.5);min-width:180px;
    display:none;animation:ctxPop .15s ease;
}
.hdr-menu.show{display:block;}
.hdr-menu button{
    display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;
    background:none;border:none;color:var(--txt);font-size:15px;font-family:var(--fn);
    border-radius:8px;cursor:pointer;text-align:left;
}
.hdr-menu button:active{background:rgba(255,255,255,.06);}
.hdr-menu .danger{color:var(--red);}
    </style>
</head>
<body>

<!-- ═══ SETUP SCREEN ═══ -->
<div class="screen" id="setup-screen">
    <div class="brand">
        <div class="brand-icon">💬</div>
        <h1>Private Chat</h1>
        <p>Real-time messaging · No sign-up<br>Powered by Firebase</p>
    </div>
    <div class="setup-card">
        <div class="field">
            <label>Your Name</label>
            <input id="inp-name" type="text" placeholder="e.g. Alex" maxlength="20" autocomplete="off">
        </div>
        <div class="field">
            <label>Room Code</label>
            <input id="inp-room" type="text" placeholder="e.g. my-secret-room" maxlength="40"
                   autocomplete="off" autocapitalize="none" spellcheck="false">
        </div>
        <div class="room-hint">
            <span>🔒</span>
            <span>Both phones must use the <strong>same room code</strong>.</span>
        </div>
        <button class="btn btn-primary" onclick="enterChat()">Enter Chat Room →</button>
    </div>
</div>

<!-- ═══ CHAT SCREEN ═══ -->
<div class="screen hidden" id="chat-screen">
    <div class="chat-hdr">
        <div class="hdr-avatar" id="hdr-avatar">💬</div>
        <div class="hdr-info">
            <div class="hdr-name" id="hdr-name">Chat</div>
            <div class="hdr-sub">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-txt">Connecting…</span>
            </div>
        </div>
        <button class="icon-btn" onclick="toggleMenu()" title="Menu">⋮</button>
        <button class="icon-btn" onclick="leaveRoom()" title="Leave">✕</button>

        <!-- Header dropdown menu -->
        <div class="hdr-menu" id="hdr-menu">
            <button onclick="showClearModal()">🗑️ Clear all chats</button>
            <button onclick="leaveRoom()">🚪 Leave room</button>
        </div>
    </div>

    <div class="msgs-wrap" id="msgs"></div>

    <div class="typing-row" id="typing-row">
        <div class="typing-bubble">
            <span class="typing-name" id="typing-name-lbl"></span>
            <div class="td"></div><div class="td"></div><div class="td"></div>
        </div>
    </div>

    <button id="scroll-btn" onclick="scrollToBottom()">↓</button>

    <!-- Delete bar (shows when message selected) -->
    <div id="delete-bar">
        <button class="del-cancel" onclick="deselectMsg()">Cancel</button>
        <div style="display:flex;gap:8px;">
            <button class="del-bar-btn del-me" onclick="deleteForMe()">Delete for me</button>
            <button class="del-bar-btn del-everyone" id="del-everyone-btn" onclick="deleteForEveryone()">Delete for all</button>
        </div>
    </div>

    <div class="input-bar" id="input-bar">
        <div class="textarea-wrap">
            <textarea id="msg-input" rows="1" placeholder="Message…"
                oninput="onInputChange()" onkeydown="handleKey(event)"></textarea>
        </div>
        <button class="send-btn" onclick="sendMsg()" aria-label="Send">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<!-- Clear all modal -->
<div class="modal-bg" id="clear-modal">
    <div class="modal-box">
        <h3>🗑️ Clear all chats?</h3>
        <p>This will delete all messages in this room for <strong>everyone</strong>. This cannot be undone.</p>
        <div class="modal-btns">
            <button class="m-cancel" onclick="closeClearModal()">Cancel</button>
            <button class="m-danger" onclick="clearAllChats()">Delete All</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
/* ════════════════════════════════════════
   FIREBASE
════════════════════════════════════════ */
firebase.initializeApp({
    apiKey: "AIzaSyAM38TNuh6E_Z8cmCI74fXCPS7gT9HzT_c",
    authDomain: "p2p-chat-bd3c5.firebaseapp.com",
    databaseURL: "https://p2p-chat-bd3c5-default-rtdb.firebaseio.com",
    projectId: "p2p-chat-bd3c5",
    storageBucket: "p2p-chat-bd3c5.firebasestorage.app",
    messagingSenderId: "477705246923",
    appId: "1:477705246923:web:cb27af8023ee37b374e34e"
});
const db = firebase.database();

/* ════════════════════════════════════════
   STATE
════════════════════════════════════════ */
let myName='', roomId='';
let myUid = 'u_'+Math.random().toString(36).slice(2,10);
let msgsRef=null, typingRef=null, presRef=null;
let lastDateShown=null, typingTimer=null, isTypingNow=false;
let unread=0, atBottom=true;
let renderedKeys = new Set();
let selectedKey = null;
let selectedIsSent = false;

/* ════════════════════════════════════════
   FIX: Mobile keyboard handling
════════════════════════════════════════ */
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
        const chat = document.getElementById('chat-screen');
        if (chat && !chat.classList.contains('hidden')) {
            chat.style.height = window.visualViewport.height + 'px';
            scrollToBottom();
        }
    });
    window.visualViewport.addEventListener('scroll', () => {
        const chat = document.getElementById('chat-screen');
        if (chat && !chat.classList.contains('hidden')) {
            chat.style.height = window.visualViewport.height + 'px';
        }
    });
}

/* ════════════════════════════════════════
   AUTO-LOGIN
════════════════════════════════════════ */
window.addEventListener('load', () => {
    const savedName = localStorage.getItem('chat_name');
    const urlRoom = new URLSearchParams(location.search).get('room');
    const savedRoom = localStorage.getItem('chat_room');
    const room = urlRoom || savedRoom;

    if (savedName && room) {
        myName = savedName;
        roomId = room.toLowerCase().replace(/[^a-z0-9\-_]/g,'-');
        localStorage.setItem('chat_room', roomId);
        const url = new URL(location.href);
        url.searchParams.set('room', roomId);
        history.replaceState({}, '', url);
        startChat();
        return;
    }

    if (savedName) document.getElementById('inp-name').value = savedName;
    if (room) document.getElementById('inp-room').value = room;

    document.getElementById('inp-name').addEventListener('keydown', e => {
        if (e.key==='Enter') document.getElementById('inp-room').focus();
    });
    document.getElementById('inp-room').addEventListener('keydown', e => {
        if (e.key==='Enter') enterChat();
    });
});

function enterChat() {
    const name = document.getElementById('inp-name').value.trim();
    const room = document.getElementById('inp-room').value.trim().toLowerCase().replace(/[^a-z0-9\-_]/g,'-');
    if (!name) { showToast('⚠️ Enter your name!'); return; }
    if (!room) { showToast('⚠️ Enter a room code!'); return; }
    myName=name; roomId=room;
    localStorage.setItem('chat_name', name);
    localStorage.setItem('chat_room', room);
    const url = new URL(location.href);
    url.searchParams.set('room', room);
    history.replaceState({}, '', url);
    startChat();
}

/* ════════════════════════════════════════
   CHAT INIT
════════════════════════════════════════ */
function startChat() {
    document.getElementById('hdr-name').textContent = '# '+roomId;
    document.getElementById('hdr-avatar').textContent = roomId[0].toUpperCase();
    setStatus('','Connecting…');

    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('chat-screen').classList.remove('hidden');

    // Apply viewport height fix
    if (window.visualViewport) {
        document.getElementById('chat-screen').style.height = window.visualViewport.height+'px';
    }

    setTimeout(() => document.getElementById('msg-input').focus(), 300);

    msgsRef   = db.ref('rooms/'+roomId+'/messages');
    typingRef = db.ref('rooms/'+roomId+'/typing/'+myUid);
    presRef   = db.ref('rooms/'+roomId+'/presence/'+myUid);

    presRef.set({name:myName,online:true,ts:firebase.database.ServerValue.TIMESTAMP});
    presRef.onDisconnect().remove();

    // Presence
    db.ref('rooms/'+roomId+'/presence').on('value', snap => {
        const pres = snap.val()||{};
        const online = Object.entries(pres).filter(([uid,v])=>uid!==myUid&&v.online);
        if (online.length>0) setStatus('online', online.map(([,v])=>v.name).join(', ')+' online');
        else setStatus('offline','Waiting for friend…');
    });

    // Messages
    msgsRef.limitToLast(100).on('child_added', snap => {
        const msg = snap.val();
        if (msg) renderMessage(snap.key, msg);
    });

    // Message changes (delete, read)
    msgsRef.on('child_changed', snap => {
        const msg = snap.val();
        const key = snap.key;
        const el = document.querySelector('.msg-row[data-key="'+key+'"]');
        if (!el) return;

        if (msg.deleted) {
            el.classList.add('deleted');
            el.querySelector('.bubble').innerHTML = '🚫 <i>Message deleted</i>';
            const sn = el.querySelector('.sender-name');
            if (sn) sn.remove();
        }

        if (msg.readBy && msg.uid===myUid) {
            const tick = el.querySelector('.tick');
            if (tick && Object.keys(msg.readBy).some(uid=>uid!==myUid)) {
                tick.textContent = '✓✓';
                tick.classList.add('read');
            }
        }
    });

    // Message removed
    msgsRef.on('child_removed', snap => {
        const el = document.querySelector('.msg-row[data-key="'+snap.key+'"]');
        if (el) el.remove();
        renderedKeys.delete(snap.key);
    });

    // Connected
    db.ref('.info/connected').on('value', snap => {
        if (snap.val()) setStatus('online','Connected');
        else setStatus('offline','Reconnecting…');
    });

    // Typing
    db.ref('rooms/'+roomId+'/typing').on('value', snap => {
        const typing = snap.val()||{};
        const others = Object.entries(typing).filter(([uid,v])=>uid!==myUid&&v&&v.name);
        if (others.length>0) {
            document.getElementById('typing-name-lbl').textContent = others.map(([,v])=>v.name).join(', ')+' typing';
            document.getElementById('typing-row').classList.add('show');
            scrollToBottomIfNear();
        } else {
            document.getElementById('typing-row').classList.remove('show');
        }
    });

    // Scroll
    const msgsEl = document.getElementById('msgs');
    msgsEl.addEventListener('scroll', () => {
        const diff = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight;
        atBottom = diff < 60;
        document.getElementById('scroll-btn').classList.toggle('show', !atBottom);
        if (atBottom) { unread=0; document.title='Chat'; }
    });

    // Read on visibility
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) { markAllRead(); unread=0; document.title='Chat'; }
    });

    setTimeout(() => addSysMsg('🔒 Joined room: '+roomId), 200);
}

/* ════════════════════════════════════════
   SEND
════════════════════════════════════════ */
function sendMsg() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;
    stopTyping();
    input.value=''; input.style.height='';
    msgsRef.push({
        name:myName, uid:myUid, text:text,
        ts:firebase.database.ServerValue.TIMESTAMP
    });
}

/* ════════════════════════════════════════
   RENDER MESSAGE
════════════════════════════════════════ */
function renderMessage(key, msg) {
    if (renderedKeys.has(key)) return;
    renderedKeys.add(key);

    const msgs = document.getElementById('msgs');
    const isSent = msg.uid===myUid;
    const ts = msg.ts||Date.now();
    const date = new Date(ts);

    // Date sep
    const dayStr = date.toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
    if (dayStr!==lastDateShown) {
        lastDateShown = dayStr;
        const sep = document.createElement('div');
        sep.className='date-sep';
        const today=new Date();today.setHours(0,0,0,0);
        const yest=new Date(today);yest.setDate(today.getDate()-1);
        const md=new Date(date);md.setHours(0,0,0,0);
        sep.textContent = md.getTime()===today.getTime()?'Today':
                          md.getTime()===yest.getTime()?'Yesterday':dayStr;
        msgs.appendChild(sep);
    }

    const timeStr = date.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
    const row = document.createElement('div');
    row.className = 'msg-row '+(isSent?'sent':'recv');
    row.dataset.key = key;

    const isDeleted = msg.deleted;
    if (isDeleted) row.classList.add('deleted');

    let tickClass='tick', tickText='✓';
    if (isSent&&msg.readBy) {
        if (Object.keys(msg.readBy).some(uid=>uid!==myUid)) {
            tickClass='tick read'; tickText='✓✓';
        }
    }

    const bubbleContent = isDeleted ? '🚫 <i>Message deleted</i>' :
        esc(msg.text).replace(/\n/g,'<br>');

    row.innerHTML = `
        ${(!isSent&&!isDeleted)?'<div class="sender-name">'+esc(msg.name)+'</div>':''}
        <div class="bubble">${bubbleContent}</div>
        <div class="bubble-meta">
            <span>${timeStr}</span>
            ${isSent?'<span class="'+tickClass+'" id="tick-'+key+'">'+tickText+'</span>':''}
        </div>`;

    // Tap to select for delete
    if (!isDeleted) {
        row.addEventListener('click', (e) => {
            e.stopPropagation();
            selectMsg(key, isSent);
        });
    }

    msgs.appendChild(row);
    scrollToBottomIfNear();

    // Mark read
    if (!isSent && !document.hidden) markMsgRead(key);
    if (document.hidden && !isSent) {
        unread++;
        document.title = '('+unread+') Chat';
    }
}

function addSysMsg(text) {
    const msgs = document.getElementById('msgs');
    const div = document.createElement('div');
    div.className='sys-msg'; div.textContent=text;
    msgs.appendChild(div); scrollToBottom();
}

/* ════════════════════════════════════════
   SELECT & DELETE MESSAGES
════════════════════════════════════════ */
function selectMsg(key, isSent) {
    // Deselect previous
    document.querySelectorAll('.msg-row.selected').forEach(el=>el.classList.remove('selected'));

    if (selectedKey===key) { deselectMsg(); return; } // Toggle off

    selectedKey = key;
    selectedIsSent = isSent;

    const el = document.querySelector('.msg-row[data-key="'+key+'"]');
    if (el) el.classList.add('selected');

    // Show delete bar, hide input bar
    document.getElementById('input-bar').style.display='none';
    document.getElementById('delete-bar').classList.add('show');

    // Only show "delete for all" for own messages
    document.getElementById('del-everyone-btn').style.display = isSent?'flex':'none';
}

function deselectMsg() {
    document.querySelectorAll('.msg-row.selected').forEach(el=>el.classList.remove('selected'));
    selectedKey=null;
    document.getElementById('delete-bar').classList.remove('show');
    document.getElementById('input-bar').style.display='flex';
}

function deleteForMe() {
    if (!selectedKey) return;
    const el = document.querySelector('.msg-row[data-key="'+selectedKey+'"]');
    if (el) { el.remove(); renderedKeys.delete(selectedKey); }
    deselectMsg();
    showToast('🗑️ Deleted for you');
}

function deleteForEveryone() {
    if (!selectedKey||!msgsRef) return;
    msgsRef.child(selectedKey).update({deleted:true, text:''});
    deselectMsg();
    showToast('🗑️ Deleted for everyone');
}

/* ════════════════════════════════════════
   CLEAR ALL
════════════════════════════════════════ */
function showClearModal() {
    closeMenu();
    document.getElementById('clear-modal').classList.add('show');
}
function closeClearModal() {
    document.getElementById('clear-modal').classList.remove('show');
}
function clearAllChats() {
    if (!msgsRef) return;
    db.ref('rooms/'+roomId+'/messages').remove();
    renderedKeys.clear();
    lastDateShown=null;
    document.getElementById('msgs').innerHTML='';
    closeClearModal();
    addSysMsg('🗑️ All messages cleared');
    showToast('✅ All chats cleared');
}

/* ════════════════════════════════════════
   READ RECEIPTS
════════════════════════════════════════ */
function markMsgRead(key) {
    if (!msgsRef) return;
    msgsRef.child(key).child('readBy').child(myUid).set(true);
}
function markAllRead() {
    document.querySelectorAll('.msg-row.recv').forEach(row => {
        const key = row.dataset.key;
        if (key) markMsgRead(key);
    });
}

/* ════════════════════════════════════════
   HEADER MENU
════════════════════════════════════════ */
function toggleMenu() {
    document.getElementById('hdr-menu').classList.toggle('show');
}
function closeMenu() {
    document.getElementById('hdr-menu').classList.remove('show');
}
// Close menu on outside tap
document.addEventListener('click', (e) => {
    if (!e.target.closest('.hdr-menu') && !e.target.closest('.icon-btn')) closeMenu();
});

/* ════════════════════════════════════════
   TYPING
════════════════════════════════════════ */
function onInputChange() {
    autoResize(document.getElementById('msg-input'));
    if (!typingRef) return;
    if (!isTypingNow) {
        isTypingNow=true;
        typingRef.set({name:myName});
        typingRef.onDisconnect().remove();
    }
    clearTimeout(typingTimer);
    typingTimer=setTimeout(stopTyping,2000);
}
function stopTyping() {
    if (isTypingNow&&typingRef) typingRef.remove();
    isTypingNow=false; clearTimeout(typingTimer);
}

/* ════════════════════════════════════════
   HELPERS
════════════════════════════════════════ */
function setStatus(cls,txt) {
    document.getElementById('status-dot').className='status-dot'+(cls?' '+cls:'');
    document.getElementById('status-txt').textContent=txt;
}
function scrollToBottom() {
    const m=document.getElementById('msgs');
    m.scrollTop=m.scrollHeight;
    atBottom=true;
    document.getElementById('scroll-btn').classList.remove('show');
}
function scrollToBottomIfNear() { if(atBottom) scrollToBottom(); }
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px'; }
function handleKey(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} }

function leaveRoom() {
    closeMenu();
    if(presRef){presRef.remove();presRef=null;}
    if(typingRef){typingRef.remove();typingRef=null;}
    if(msgsRef){msgsRef.off();msgsRef=null;}
    renderedKeys.clear(); lastDateShown=null;
    document.getElementById('msgs').innerHTML='';
    document.getElementById('chat-screen').classList.add('hidden');
    document.getElementById('setup-screen').classList.remove('hidden');
    localStorage.removeItem('chat_room');
}

function showToast(msg,dur=3000) {
    const t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    clearTimeout(t._timer);
    t._timer=setTimeout(()=>t.classList.remove('show'),dur);
}
function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
